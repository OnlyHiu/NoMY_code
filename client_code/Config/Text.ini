261=════════ 插件使用说明 ════════
    插件是独立的功能模块，放入 plugins/<插件名>/main.py 后，点击「重新加载插件」即加载生效，并在左侧导航「插件」分组下生成新功能界面。

    一、如何编写插件（3 步）
        1. 复制 plugins/example_tool/ 目录，改名为你的插件名；
        2. 在 main.py 中实现 PluginBase 子类：meta（名称/分类/描述/版本/图标）+ create_widget(host, parent) 返回你的功能界面；
        3. 保存 main.py 后点击下方「重新加载插件」按钮即热重载生效（无需重启程序）

    二、可用的宿主接口（HostApi，通过 create_widget 的 host 参数获取）
      - 通知: host.show_info(title, content) / show_warning / show_success
      - 文件选择: host.choose_file / choose_files / choose_directory / save_file
      - 对话框: host.confirm(title, content) 确认框；host.input_text(title, label) 输入框；host.select_option(title, label, items) 下拉选择
      - 配置持久化: host.get_config(key, default) / host.set_config(key, value)，自动保存到 Config/Plugins/<插件名>.json，重启后仍可读取
      - 剪贴板/打开: host.copy_to_clipboard(text)；host.open_file(path)；host.open_url(url)；host.open_directory(path)
      - 异步执行: host.run_async(fn, on_done) —— 耗时操作放后台，不卡界面
      - 命令执行: host.run_command(cmd, on_done) —— 后台执行 adb 等命令，回调 (returncode, stdout, stderr)，不弹黑窗
      - 日志: host.get_logger(name)

    三、对使用到的库的要求
      - 只能使用主程序已打包的库：PySide6、qfluentwidgets、psutil 及标准库；
      - 插件需要额外第三方库时，必须告知管理员在打包命令中追加--hidden-import 库名，否则运行时报 ImportError；
      - 插件禁止 import fluwidget 或主窗口对象，一律通过 host 访问宿主能力，插件之间、插件与主程序保持完全解耦。

    四、线程安全规则（避免崩溃）
      - 耗时操作使用 host.run_async 放到后台线程；
      - 后台线程里绝对不能直接读写界面控件，只能使用主线程提前捕获的数据；
      - 不要在界面的事件槽里同步执行长时间任务。
	  
    五、打包与分发
      - 程序打包后，插件放在 exe 旁边的 plugins/ 目录即可，无需重新打包；
      - 单个插件加载/运行出错只影响它自己，不会拖垮主程序；
      - 修改插件后点击「重新加载插件」按钮即可热重载，无需重启程序。

